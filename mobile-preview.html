<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mobile Preview</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        min-height: 100%;
        margin: 0;
      }

      body {
        display: grid;
        place-items: center;
        padding: 24px;
        background: #181818;
        color: #aaa;
      }

      .preview-label {
        margin: 0 0 10px;
        text-align: center;
        font-size: 12px;
        letter-spacing: 0.08em;
      }

      .mobile-viewport {
        width: 390px;
        height: 844px;
        overflow: hidden;
        border: 1px solid #555;
        border-radius: 18px;
        background: #080808;
        box-shadow: 0 18px 60px rgb(0 0 0 / 55%);
      }

      iframe {
        display: block;
        width: 100%;
        height: 100%;
        border: 0;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="preview-label" id="preview-label">390 × 844 · HOME</p>
      <div class="mobile-viewport">
        <iframe
          id="preview-frame"
          title="Mobile preview"
        ></iframe>
      </div>
    </main>
    <script>
      const detail = new URLSearchParams(location.search).get("page") === "detail";
      document.getElementById("preview-frame").src = detail
        ? "/project-detail.html?id=xtra-space"
        : "/index.html";
      document.getElementById("preview-label").textContent = detail
        ? "390 × 844 · PROJECT DETAIL"
        : "390 × 844 · HOME";
    </script>
  </body>
</html>
