<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="Portfolio of Jihun Park, Architecture and Computational Design student.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">

<body class="viewfinder-home">
    <div class="grid-background"></div>
    <canvas id="computational-canvas"></canvas>

    <div class="vf-chrome" aria-hidden="false">
        <header class="vf-topbar">
            <a href="index.html" class="logo">Jihun_Park<span>()</span></a>
            <p class="vf-position">Same outcome. Different focus.</p>
            <div class="vf-top-actions">
                <a href="mailto:jhp503@gmail.com" class="vf-contact">Contact</a>
            </div>
        </header>

        <div class="vf-frame-marks" aria-hidden="true">
            <span class="vf-corner tl"></span>
            <span class="vf-corner tr"></span>
            <span class="vf-corner bl"></span>
            <span class="vf-corner br"></span>
        </div>

        <div class="vf-readout" id="vf-readout">
            <span class="vf-readout-label">FOCUS</span>
            <span class="vf-readout-value" id="vf-focus-name">—</span>
            <span class="vf-readout-hint" id="vf-hint">Space+drag pan · Scroll zoom · Drag cards</span>
        </div>
    </div>

    <div class="vf-viewport" id="vf-viewport">
        <div class="vf-world" id="vf-world">
            <main class="vf-field" id="vf-field" aria-label="Project field">
                <!-- Project subjects inserted by script.js -->
            </main>
        </div>
    </div>

    <script src="js/projects.js?v=3.2"></script>
    <script src="js/script.js?v=4.7"></script>
