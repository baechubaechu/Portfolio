<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Jihun_Park.gh | Node Workspace</title>
    <meta name="description" content="Interactive Node-Based Portfolio">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;700&family=Inter:wght@300;400;500;700&display=swap"
        rel="stylesheet">

    <!-- Retain GH Theme colors/styles -->
    <link rel="stylesheet" href="css/theme-grasshopper.css?v=4">
    <!-- Workspace specific styles -->
    <link rel="stylesheet" href="css/node-workspace.css?v=4">
</head>

<body class="gh-theme">

    <!-- Infinite canvas container -->
    <div id="workspace-container">

        <!-- Scaled / Translated interactive layer -->
        <div id="workspace-transform">
            <!-- Background grid pattern -->
            <div id="grid-bg"></div>

            <!-- SVG layer for drawing bezier curves/wires -->
            <svg id="wire-canvas"></svg>

            <!-- DOM layer for the actual nodes -->
            <div id="node-canvas">
                <!-- Nodes generated via JS -->
            </div>
        </div>

    </div>

    <!-- UI Overlay Layer (Fixed to screen) -->
    <div id="ui-layer">
        <!-- Top bar -->
        <header class="navbar">
            <div class="logo">Jihun_Park<span>.gh</span> <span class="version-tag">v2.0</span></div>
            <div class="top-controls">
                <button id="btn-reset-view" class="icon-btn" title="Reset Camera">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7" />
                    </svg>
                </button>
            </div>
            <div class="status-bar" id="gh-status">Loaded 12 Projects · System Ready</div>
        </header>

        <!-- Node Add Palette -->
        <div id="node-palette" class="floating-panel">
            <div class="panel-header">Components</div>
            <div class="palette-list">
                <div class="palette-item" draggable="true" data-type="Skill">
                    <span class="dot tool-dot"></span> Skill / Tool
                </div>
                <div class="palette-item" draggable="true" data-type="Category">
                    <span class="dot cat-dot"></span> Category
                </div>
                <div class="palette-item" draggable="true" data-type="Output">
                    <span class="dot out-dot"></span> Project Output
                </div>
            </div>
            <div class="palette-footer">Drag to canvas</div>
        </div>

        <!-- Sidebar for displaying output matching projects -->
        <aside id="projects-panel">
            <div class="panel-header">
                <h3>Projects Out <span id="project-count" class="badge">0</span></h3>
                <button id="close-panel" title="Close Panel">&times;</button>
            </div>
            <div id="projects-list">
                <!-- Target for filtered project cards -->
                <div class="empty-state">
                    Connect logic nodes to the Output port to reveal projects.
                </div>
            </div>
        </aside>

        <!-- Context Menu / Tooltip -->
        <div id="tooltip" class="hidden"></div>
    </div>

    <!-- Data source -->
    <script src="js/projects.js?v=4"></script>
    <!-- Node Application -->
    <script type="module" src="js/node-system/main.js?v=4"></script>
</body>

</html>
